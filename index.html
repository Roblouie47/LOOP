<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Looper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h1>YouTube Video Looper</h1>
        <form id="youtube-form">
            <input type="url" id="youtube-url" placeholder="Paste YouTube URL here" required>
            <label for="loop-count">Loop count (1-100):</label>
            <input type="number" id="loop-count" min="1" max="100" value="1" required>
            <button type="submit">Load & Loop</button>
        </form>
        <div id="player-container"></div>
    </div>
        <script src="script.js"></script>
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('service-worker.js');
                });
            }
        </script>
</body>
</html>
